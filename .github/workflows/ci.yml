name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test resumable release gate and pinned installers
        shell: bash
        run: |
          bash .github/scripts/test-release-artifact.sh
          bash .github/scripts/test-render-release-installers.sh

      - name: Validate public contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "keepalived-s:$version" unraid/my-Keepalived.xml
          grep -F "FIP_APP_VERSION=$version" .env.example
          grep -F "LICENSE_SPDX=Apache-2.0" .env.example
          grep -F "cryptography==50.0.1" docker/keepalived/requirements.txt
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          grep -F 'Keepalived 2.3.4' THIRD_PARTY_NOTICES.md
          grep -F 'iproute2 7.0.0' THIRD_PARTY_NOTICES.md
          grep -Fx '.env' .dockerignore
          grep -Fx 'secrets' .dockerignore
          if grep -R -E '__[A-Z0-9_]+__' unraid; then
            echo "La plantilla contiene marcadores sin resolver" >&2
            exit 1
          fi
          if grep -R -E '10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.' \
              unraid .env.example docker-compose.yml; then
            echo "Hay direcciones RFC1918 incrustadas en artefactos de instalación" >&2
            exit 1
          fi

      - name: Validate Compose, XML, renderer and shell
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          python -c "import xml.etree.ElementTree as E; E.parse('unraid/my-Keepalived.xml')"
          version="$(tr -d ' \r\n' < VERSION)"
          python render-unraid-template.py unraid/my-Keepalived.xml \
            --repository "registry.example/floating-ip:$version" \
            --webui 'http://[IP]:7000/' > /tmp/rendered.xml
          python -c "import xml.etree.ElementTree as E; E.parse('/tmp/rendered.xml')"
          bash -n build-image.sh deploy-floating-ip.sh manifiesto.sh \
            manifiesto.example.sh provision-security-secrets.sh prepare-compose-storage.sh \
            docker/keepalived/entrypoint.sh docker/keepalived/check-http \
            docker/keepalived/tests/test-deploy-dry-run.sh \
            docker/keepalived/tests/test-compose-storage.sh \
            docker/keepalived/tests/test-deploy-secret-preflight.sh \
            .github/scripts/release-artifact.sh \
            .github/scripts/test-release-artifact.sh \
            .github/scripts/test-render-release-installers.sh
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 \
            shellcheck build-image.sh deploy-floating-ip.sh manifiesto.sh \
              manifiesto.example.sh provision-security-secrets.sh prepare-compose-storage.sh \
              docker/keepalived/entrypoint.sh docker/keepalived/check-http \
              docker/keepalived/tests/test-deploy-dry-run.sh \
              docker/keepalived/tests/test-compose-storage.sh \
              docker/keepalived/tests/test-deploy-secret-preflight.sh \
              .github/scripts/release-artifact.sh \
              .github/scripts/test-release-artifact.sh \
              .github/scripts/test-render-release-installers.sh
          bash docker/keepalived/tests/test-deploy-dry-run.sh
          bash docker/keepalived/tests/test-compose-storage.sh
          bash docker/keepalived/tests/test-deploy-secret-preflight.sh
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Audit Python dependencies and source
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" -w /src \
            python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31 sh -c '
            pip install --quiet pip-audit==2.10.1 bandit==1.9.4 &&
            pip-audit --requirement docker/keepalived/requirements.txt --progress-spinner off &&
            bandit -r docker/keepalived/panel
          '

      - name: Build image and run embedded tests
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          source_url="$(sed -n 's/^SOURCE_URL=//p' .env.example)"
          docker build --pull --tag floating-ip:ci \
            --file docker/keepalived/Dockerfile \
            --build-arg "FIP_APP_VERSION=$version" \
            --build-arg "SOURCE_URL=$source_url" .

      - name: Check runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          source_url="$(sed -n 's/^SOURCE_URL=//p' .env.example)"
          test "$(docker image inspect floating-ip:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect floating-ip:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "$source_url"
          test "$(docker image inspect floating-ip:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "Apache-2.0"
          test "$(docker image inspect floating-ip:ci --format '{{index .Config.Labels "io.ezr43l.cluster-protocol"}}')" = "v2"
          test "$(docker image inspect floating-ip:ci --format '{{index .Config.Labels "io.ezr43l.image.third-party-notices"}}')" = "/opt/THIRD_PARTY_NOTICES.md"
          docker run --rm --entrypoint test floating-ip:ci -f /opt/LICENSE
          docker run --rm --entrypoint test floating-ip:ci -f /opt/THIRD_PARTY_NOTICES.md
          docker run --rm --entrypoint test floating-ip:ci -f /opt/licenses/keepalived-COPYING
          docker run --rm --entrypoint test floating-ip:ci -f /opt/licenses/iproute2-COPYING
          docker run --rm --entrypoint sh floating-ip:ci -c '
            set -eu
            sed -n "/^P:libcrypto3$/,/^$/p" /lib/apk/db/installed | grep -Fx "V:3.5.8-r0"
            sed -n "/^P:libssl3$/,/^$/p" /lib/apk/db/installed | grep -Fx "V:3.5.8-r0"
            sed -n "/^P:libuuid$/,/^$/p" /lib/apk/db/installed | grep -Fx "V:2.42.3-r1"
            sed -n "/^P:keepalived$/,/^$/p" /lib/apk/db/installed | grep -Fx "V:2.3.4-r2"
            sed -n "/^P:keepalived$/,/^$/p" /lib/apk/db/installed | grep -Fx "L:GPL-2.0-only"
            sed -n "/^P:keepalived$/,/^$/p" /lib/apk/db/installed | grep -Fx "c:e0fe0621ab32bf73a803d0e7d0c8c084c784dfd2"
            sed -n "/^P:iproute2$/,/^$/p" /lib/apk/db/installed | grep -Fx "V:7.0.0-r0"
            sed -n "/^P:iproute2$/,/^$/p" /lib/apk/db/installed | grep -Fx "L:GPL-2.0-or-later"
            sed -n "/^P:iproute2$/,/^$/p" /lib/apk/db/installed | grep -Fx "c:3ee752ad0c8445c8105177cd5cebdd730789bcd8"
          '

      - name: Reject all critical or high vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --skip-version-check --scanners vuln \
            --severity CRITICAL,HIGH --exit-code 1 floating-ip:ci

      - name: Exercise canonical Python VRRP lab
        shell: bash
        run: python3 docker/keepalived/tests/secure_vrrp_lab.py --image floating-ip:ci

      - name: Secret scan of the exportable tree
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir . --no-banner --redact --exit-code 1
